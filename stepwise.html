<head>

<style>
:root{--bg:#f3efe7;--surf:#e8e3d8;--ink:#171510;--ink2:#4a463d;--bar:#cdc6b5;--acc:#d6410f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130f;--surf:#211f19;--ink:#f1ede3;--ink2:#b9b3a3;--bar:#3c3931;--acc:#ff6a35;--on:#14130f}}
:root[data-theme="dark"]{--bg:#14130f;--surf:#211f19;--ink:#f1ede3;--ink2:#b9b3a3;--bar:#3c3931;--acc:#ff6a35;--on:#14130f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px 64px}
.top{display:flex;justify-content:space-between;padding:20px 0}
.top b{font-weight:700;letter-spacing:-.02em}
h1{font-size:clamp(40px,7vw,92px);line-height:.94;letter-spacing:-.045em;margin:16px 0 40px;font-weight:700;max-width:14ch}
h1 em{font-style:normal;color:var(--acc)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;align-items:start}
nav{display:flex;flex-direction:column;gap:2px}
nav h3{font-size:12px;font-weight:600;margin:20px 0 6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}

nav button{all:unset;cursor:pointer;padding:7px 10px;font-weight:500;line-height:1.3}
nav button:hover{background:var(--surf)}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.035em;line-height:1;margin:0 0 16px}
.stage{background:var(--surf);padding:20px 16px;overflow-x:auto;min-height:190px;display:flex;align-items:center}
.stage svg{display:block;max-width:100%;height:auto;margin:0 auto;color:var(--ink)}
.nb{fill:var(--bg);stroke:var(--ink);stroke-width:2}.nb.hl{fill:var(--acc);stroke:var(--acc)}.nb.em{stroke:var(--bar);stroke-dasharray:4 4}
.tx{fill:var(--ink);font:600 16px "Instrument Sans",system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}.tx.hl{fill:var(--on)}
.t{fill:var(--ink2);font:500 13px "Instrument Sans",system-ui,sans-serif;text-anchor:middle}
.ln{stroke:var(--ink);stroke-width:2}.ar{stroke:var(--ink);stroke-width:2;fill:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:16px 0 8px}
.ctl input[type=text]{width:120px;padding:9px 10px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.ctl button{all:unset;cursor:pointer;padding:9px 14px;background:var(--surf);font-weight:600;font-size:15px}
.ctl button.pri{background:var(--acc);color:var(--on)}
.ctl label{display:flex;gap:8px;align-items:center;font-size:14px}
.ctl input[type=range]{accent-color:var(--acc);width:90px}
.cd{background:var(--surf);padding:16px;overflow-x:auto}.cd svg{display:block;max-width:100%;height:auto;margin:0 auto;color:var(--ink)}
.t.tl{text-anchor:start}.t.ac{fill:var(--acc);font-weight:700}.nb.dn{fill:var(--ink)}.tx.dn{fill:var(--bg)}.ar.ac{stroke:var(--acc)}
.ex2{display:grid;grid-template-columns:1fr 1fr;gap:24px 32px;margin-top:24px;align-items:start}
#ex2{margin:0 0 36px}.ex2 .pb{grid-column:1/-1}.ex2 .pb p{margin:0;font-weight:600}
.stp{margin:0;padding-left:22px}.stp li{margin-bottom:10px}
pre.cpp{margin:0;background:var(--surf);padding:14px 16px;overflow-x:auto;line-height:1.5}.cpp code{font-size:13.5px;white-space:pre}
.ed{background:var(--surf)}
.edh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--bar);font:600 13px/1 ui-monospace,Menlo,Consolas,monospace}
.edb{display:flex;gap:6px}
.edb button{all:unset;cursor:pointer;padding:7px 11px;background:var(--bg);font:600 13px "Instrument Sans",system-ui,sans-serif}
.edb button.pri{background:var(--acc);color:var(--on)}
.edb button:focus-visible,textarea.cpp:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.edw{display:flex;overflow:hidden}
.gut,textarea.cpp{margin:0;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;padding-top:12px;padding-bottom:12px}
.gut{padding-left:12px;padding-right:8px;text-align:right;color:var(--ink2);overflow:hidden;user-select:none;min-width:38px}
textarea.cpp{flex:1;min-width:0;border:0;padding-left:8px;padding-right:12px;background:transparent;color:var(--ink);resize:none;white-space:pre;overflow:auto;tab-size:4}
.ol{font-size:12px;font-weight:600;color:var(--ink2);padding:10px 12px 0;border-top:1px solid var(--bar)}
.outp{margin:0;padding:6px 12px 12px;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;min-height:56px}
.ex2{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
@media (max-width:860px){.ex2{grid-template-columns:1fr}}

.cxh label{display:flex;gap:8px;align-items:center;font-size:14px}.cxh input{accent-color:var(--acc);width:160px}
.cxg{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cxt{font-size:13px;font-weight:600;margin-bottom:4px}
.cxg svg{display:block;width:100%;height:auto;color:var(--ink)}
.cv{fill:none;stroke:var(--ink);stroke-width:2}.cv.f{stroke:var(--bar);stroke-width:1.5}.cv.c{stroke:var(--acc);stroke-width:3}.t.te{text-anchor:end}

@media (max-width:860px){.cxg{grid-template-columns:1fr}}
#info{margin-bottom:36px}
h3.sh{font-size:clamp(26px,3.4vw,40px);letter-spacing:-.035em;line-height:1;margin:0 0 10px}
.ex2 .pb p{font-weight:400;font-size:18px;max-width:70ch}
.sn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.sn button{all:unset;cursor:pointer;padding:10px 16px;background:var(--surf);font-weight:600}
.sn button.pri{background:var(--acc);color:var(--on)}.sn button[disabled]{opacity:.4;cursor:default}
.sn button:focus-visible,.sl li:focus-visible,.edr button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sn span{font-size:14px;color:var(--ink2);margin-left:4px}
.sl{list-style:none;margin:0;padding:0}

.sl .num{font-size:28px;font-weight:700;line-height:1;color:var(--ink2)}.sl li.on .num{color:var(--acc)}

.sl p{margin:0;font-size:15px;color:var(--ink2)}.sl li.on p{color:var(--ink)}
.edr{padding:8px 10px 0}.edr button{all:unset;cursor:pointer;padding:8px 16px;background:var(--acc);color:var(--on);font:700 14px "Instrument Sans",system-ui,sans-serif}
#ed .edw{margin-top:8px;display:flex;overflow:hidden;background:var(--bg)}
#ed .gut{padding:12px 8px 12px 12px;line-height:20.25px;text-align:right;color:var(--ink2);min-width:42px}
.gut .on{color:var(--acc);font-weight:700}
.cw{position:relative;flex:1;min-width:0}
.hb{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hb i{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--acc) 20%,transparent);border-left:3px solid var(--acc)}
#ed .hl2,#ed textarea.cpp{position:absolute;inset:0;margin:0;border:0;padding:12px 12px 12px 10px;font:13.5px/20.25px ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:4;width:100%;height:100%;box-sizing:border-box}
#ed .hl2{overflow:hidden;pointer-events:none;color:var(--ink)}
#ed textarea.cpp{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink);resize:none;overflow:auto;z-index:1}
.tk{color:var(--acc)}.tc{color:var(--ink2);font-style:italic}
.sin{padding:8px 12px;border-top:1px solid var(--bar);font-size:14px}.sin summary{cursor:pointer;font-weight:600}
.sin textarea{display:block;width:100%;margin-top:8px;background:var(--bg);color:var(--ink);border:1px solid var(--bar);font:13.5px ui-monospace,Menlo,Consolas,monospace;padding:8px;resize:vertical}
.smode{font-size:13px;color:var(--ink2);margin:0 0 10px}
.sn button.ex{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}
.sl li.none{display:block;cursor:default}
.msg{font-size:20px;font-weight:600;letter-spacing:-.01em;min-height:1.5em;margin:12px 0 2px}
.stat{font-size:14px;color:var(--ink2);margin-bottom:36px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:28px 40px;padding-top:24px;border-top:2px solid var(--ink)}
.info h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-weight:700}
.info p{margin:0;white-space:pre-line}
.info .w{grid-column:1/-1}
code{font:500 15px ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
details summary{cursor:pointer;font-weight:600;margin-top:8px}
@media (max-width:860px){
 .app{grid-template-columns:1fr;gap:20px}
 nav{flex-direction:row;overflow-x:auto;gap:4px;align-items:center}
 nav button{white-space:nowrap}nav h3{margin:0 4px 0 12px;white-space:nowrap}
 .info{grid-template-columns:1fr}.wrap{padding:0 16px 48px}
}
</style>

<body>
<div class="wrap">
<div class="top"><b>Stepwise Lab</b><span>Arrays · Lists · Stacks · Queues · Trees</span></div>
<h1>Type a value. Watch the structure <em>change.</em></h1>
<div class="app">
<nav id="nav" aria-label="Topics"></nav>
<main>
 <h2 id="title"></h2>
 <div class="stage" id="stage" role="img" aria-label="Data structure diagram"></div>
 <div class="ctl"><input type="text" id="v" aria-label="Value"><input type="text" id="i" aria-label="Second input"><span id="ops" style="display:contents"></span></div>
 <div class="ctl"><button id="reset">Reset</button><label>Speed <input type="range" id="spd" min="1" max="100" value="70"></label></div>
 <div class="msg" id="msg" aria-live="polite"></div>
 <div class="stat" id="stat"></div>
 <div class="info" id="info"></div>
 <div class="cxw" id="cx"><div class="cxh"><h4>Complexity graph</h4><label>What if n = <b id="cxn">5</b> <input type="range" id="cxs" min="1" max="64" value="5" aria-label="Input size n"></label></div><div class="cxg"><div><div class="cxt">Time: operations vs n</div><div id="cxT"></div></div><div><div class="cxt">Space: memory units vs n</div><div id="cxS"></div></div></div><div class="cxr" id="cxr"></div></div>
 <div class="ex2" id="ex2"></div>
 
</main>
</div>
</div>
<script>
const $=s=>document.querySelector(s),num=s=>s===''?NaN:+s,V=()=>$('#v').value.trim(),I=()=>$('#i').value.trim();
const TOPICS=[
{u:'Unit III · Arrays and Linked Lists',id:'a1',n:'Storing game entries in an array',lab:'array',ph:['Value','Index (optional)'],
d:'An array is a fixed-capacity, contiguous block of same-typed items addressed by index. A scoreboard keeps its entries in an array plus a count of used slots; inserting a new entry means shifting later entries to make room.',
f:'address(a[i]) = base + i × size\nInsert at i: shifts = n − i\nRemove at i: shifts = n − i − 1',
t:'Access a[i]: O(1)\nSearch: O(n)\nInsert / remove at index i: O(n) (O(1) at the end)',sp:'O(N) for capacity N; O(1) extra per operation',
ex:'A scoreboard holds [100, 90, 70, 40]. Insert 80 at index 2. How many entries shift, and what is the array?',ans:'n − i = 4 − 2 = 2 entries (70 and 40) shift right → [100, 90, 80, 70, 40].'},
{u:'',id:'a2',n:'Sorting an array',lab:'array',ph:['Value','Index (optional)'],
d:'Insertion sort grows a sorted prefix: take the next entry and swap it left until the entry before it is not larger. High-score tables use it to place a new entry. Press Sort to watch every swap.',
f:'Comparisons ≤ n(n − 1) / 2 (worst)\nComparisons ≥ n − 1 (best)\nSwaps = number of inversions',
t:'Best O(n) (already sorted)\nAverage and worst O(n²)',sp:'O(1), sorts in place',
ex:'Sort [5, 2, 4, 1] with insertion sort. How many swaps?',ans:'Inversions: (5,2), (5,4), (5,1), (2,1), (4,1) = 5 swaps → [1, 2, 4, 5].'},
{u:'',id:'a3',n:'Two-dimensional arrays and positional games',lab:'grid',ph:['Row (0–2)','Column (0–2)'],
d:'A 2-D array board[r][c] stores a grid in row-major order. Positional games such as tic-tac-toe keep one mark per cell and check rows, columns and diagonals for a win.',
f:'flat index = r × cols + c\ncells = rows × cols',
t:'Read or write a cell: O(1)\nWin check on an n × n board: O(n²) (O(n) if only the touched lines are checked)',sp:'O(rows × cols)',
ex:'In a 3 × 3 board, which flat index is board[2][1]?',ans:'2 × 3 + 1 = 7.'},
{u:'',id:'l1',n:'Singly linked list: insert and remove at the front',lab:'list',kind:'s',ph:['Value',''],
d:'A singly linked list is a chain of nodes, each holding data and a next pointer. head points to the first node and the last node points to null. Nodes need not be contiguous, so the list grows without shifting anything.',
f:'insertFront: n→next = head; head = n\nremoveFront: t = head; head = head→next; delete t',
t:'Insert / remove at front: O(1)\nInsert at back: O(1) with a tail pointer\nRemove at back: O(n)\nSearch: O(n)',sp:'O(n): one node (data + 1 pointer) per element',
ex:'List 4 → 9 → 16. Do insertFront(2), then removeFront() twice. What remains?',ans:'2 → 4 → 9 → 16, then remove 2, then remove 4: the list is 9 → 16.'},
{u:'',id:'l2',n:'Doubly linked list: insertion and removal',lab:'list',kind:'d',ph:['Value',''],
d:'Each node has prev and next pointers, so you can walk both ways and unlink a node in O(1) once you hold a pointer to it. Header and trailer sentinel nodes remove the special cases at the ends.',
f:'insert n after p: n→prev = p; n→next = p→next; p→next→prev = n; p→next = n\nremove p: p→prev→next = p→next; p→next→prev = p→prev',
t:'Insert / remove at either end: O(1)\nSearch: O(n)',sp:'O(n): two pointers per node',
ex:'Why is removeBack O(1) here but O(n) in a singly linked list?',ans:'tail→prev hands you the predecessor directly. A singly list must walk from head to find it.'},
{u:'',id:'l3',n:'Circularly linked lists',lab:'list',kind:'c',ph:['Value',''],
d:'In a circular list the last node points back to the first, so no pointer is null. Keeping a cursor on the tail gives access to both ends, and advancing the cursor rotates the list, as in round-robin scheduling.',
f:'tail→next = head\nadvance: cursor = cursor→next',
t:'Insert front / back: O(1) with a tail pointer\nRemove front: O(1)\nRemove back: O(n)\nRotate: O(1)',sp:'O(n)',
ex:'Tasks A, B, C in a circular list, cursor at A. After 5 advances, which task is at the cursor?',ans:'5 mod 3 = 2, so two steps past A: C.'},
{u:'',id:'l4',n:'Reversing a linked list',lab:'list',kind:'s',ph:['Value',''],
d:'Reversing a singly linked list flips every next pointer using three pointers (prev, cur, next) in a single pass, with no extra list. Press Reverse on the list above.',
f:'while cur ≠ null: next = cur→next; cur→next = prev; prev = cur; cur = next\nhead = prev',
t:'O(n): one pass',sp:'O(1): three pointers',
ex:'Reverse 1 → 2 → 3. What is prev after each loop iteration?',ans:'prev = 1, then 2, then 3. head = 3, so the list is 3 → 2 → 1.'},
{u:'Unit IV · Stacks and Queues',id:'s1',n:'Stack ADT: array-based and STL',lab:'stack',ph:['Value',''],
d:'A stack is LIFO: the last item pushed is the first popped. ADT: push(x), pop(), top(), size(), empty(). STL: std::stack<int> s; s.push(1); s.top(); s.pop();. The array version keeps t, the index of the top (−1 when empty); a linked version pushes and pops at the list head.',
f:'push: S[++t] = x\npop: return S[t--]\nsize = t + 1\noverflow when t = N − 1',
t:'push, pop, top, size, empty: all O(1)',sp:'O(N) for the array; O(n) for a linked stack',
ex:'Push 3, 8, 5, then pop twice. What does top() return?',ans:'The pops return 5 then 8, so top() = 3 and size = 1.'},
{u:'',id:'s2',n:'Reversing a vector using a stack',lab:'stack',ph:['Vector e.g. 1,2,3,4',''],
d:'Push every element of the vector onto a stack, then pop them one by one into the output. LIFO order reverses the sequence. Type a vector and press Reverse vector.',
f:'for x in v: push(x)\nfor k = 0 … n − 1: out[k] = pop()',
t:'O(n): n pushes and n pops',sp:'O(n) extra for the stack',
ex:'Reverse [1, 2, 3, 4] with a stack. What is popped first?',ans:'4, then 3, 2, 1, giving [4, 3, 2, 1].'},
{u:'',id:'q1',n:'Queue ADT: STL and array-based interface',lab:'queue',ph:['Value',''],
d:'A queue is FIFO: enqueue at the rear, dequeue from the front. ADT: enqueue, dequeue, front, size, empty. STL: std::queue<int> q; q.push(x); q.front(); q.pop();. A circular array reuses freed slots by wrapping indices modulo N.',
f:'rear slot = (f + n) mod N\ndequeue: f = (f + 1) mod N, n = n − 1',
t:'enqueue, dequeue, front: all O(1)',sp:'O(N) fixed array',
ex:'N = 8, f = 6, n = 3. Which slot does the next enqueue use?',ans:'(6 + 3) mod 8 = 1.'},
{u:'Unit V · Trees',id:'t1',n:'Tree definitions, depth and height',lab:'tree',ph:['Number',''],
d:'A tree is a hierarchy: one root, every other node has one parent, and nodes without children are leaves. Depth of a node = edges from the root; height of the tree = edges on the longest root-to-leaf path. A binary tree allows at most two children (left, right). Try Depth of value and Height.',
f:'depth(root) = 0, height(leaf) = 0\nh + 1 ≤ n ≤ 2^(h+1) − 1\nleaves ≤ 2^h',
t:'depth(v): O(depth)\nheight(T): O(n)\nsize(T): O(n)',sp:'O(n) nodes; O(h) recursion',
ex:'A full binary tree has height 3. How many nodes and leaves?',ans:'2⁴ − 1 = 15 nodes and 2³ = 8 leaves.'},
{u:'',id:'t2',n:'Preorder, inorder and postorder traversals',lab:'tree',ph:['Number',''],
d:'A traversal visits every node once. Preorder: node, left, right. Inorder: left, node, right (sorted order for a BST). Postorder: left, right, node, so children come before their parent, which is how sizes are computed and trees are deleted.',
f:'T(n) = T(left) + T(right) + O(1) = O(n)',
t:'Every traversal: O(n)',sp:'O(h) call stack: O(log n) balanced, O(n) skewed',
ex:'Root 50 with children 30 (left) and 70 (right). Give the preorder and postorder.',ans:'Preorder: 50, 30, 70. Postorder: 30, 70, 50.'},
{u:'',id:'t3',n:'Binary tree ADT and linked structure',lab:'tree',ph:['Number',''],
d:'In the linked structure each node stores an element and left and right pointers (optionally parent). ADT: root(), left(p), right(p), parent(p), isRoot(), isExternal(). Insert by the BST rule (smaller goes left, larger right) or by level order (first free child slot).',
f:'node = { v, left, right }\nBST insert: go left if x < v, else right\narray form: children of i are 2i + 1 and 2i + 2',
t:'BST insert / search: O(h) = O(log n) balanced, O(n) skewed\nLevel-order insert: O(n)',sp:'O(n)',
ex:'Insert 40, 20, 60, 10 into an empty BST. What is the height?',ans:'40 is the root, 20 left, 60 right, 10 under 20. Height = 2.'}
];
let T,hl=[],msg='',timer,A,Gd,turn,Ls,St,Ou,Q,Tr;
const svg=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>${b}</svg>`;
const sh=n=>`${n} entr${n==1?'y':'ies'}`;
function bst(v){const n={v,l:null,r:null};if(!Tr){Tr=n;return 1}let c=Tr;for(;;){if(v===c.v)return 0;const k=v<c.v?'l':'r';if(!c[k]){c[k]=n;return 1}c=c[k]}}
const path=(n,v)=>{if(!n)return null;if(n.v===v)return[v];const p=path(n.l,v)||path(n.r,v);return p&&[n.v,...p]};
function lvl(v){const n={v,l:null,r:null};if(!Tr){Tr=n;return}const q=[Tr];while(q.length){const c=q.shift();if(!c.l){c.l=n;return}if(!c.r){c.r=n;return}q.push(c.l,c.r)}}
const ht=n=>n?1+Math.max(ht(n.l),ht(n.r)):-1,cnt=n=>n?1+cnt(n.l)+cnt(n.r):0,lv=n=>n?(!n.l&&!n.r?1:lv(n.l)+lv(n.r)):0;

const EXP={"a1":{"s":[{"t":"Write down what you know","d":"The array holds [100, 90, 70, 40], so n = 4 (capacity 10). Insert x = 80 at index i = 2."},{"t":"Shift from the right end","d":"Entries from index i to the end move one slot right: n − i = 4 − 2 = 2 entries (70 and 40). Copy a[3] into a[4], then a[2] into a[3]. Going right to left overwrites nothing."},{"t":"Fill the gap","d":"Index 2 is now free, so a[2] = 80 and n becomes 5."},{"t":"Check the result","d":"The array is [100, 90, 80, 70, 40] and 2 entries shifted. One insert costs O(n)."}],"c":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Step 1: Write down what you know\n    int a[10] = {100, 90, 70, 40};\n    int n = 4, i = 2, x = 80, shifts = 0;\n\n    // Step 2: Shift from the right end\n    for (int k = n - 1; k >= i; k--) {   // shift right, last entry first\n        a[k + 1] = a[k];\n        shifts++;\n    }\n    // Step 3: Fill the gap\n    a[i] = x;                            // place the new entry\n    n++;\n\n    // Step 4: Check the result\n    cout << \"Entries shifted: \" << shifts << \"\\n\";\n    for (int k = 0; k < n; k++) cout << a[k] << \" \";\n    cout << \"\\n\";\n}"},"a2":{"s":[{"t":"Start with the array","d":"The input is [5, 2, 4, 1]. The first entry on its own already counts as a sorted prefix, and swaps starts at 0."},{"t":"Slide each entry left","d":"i = 1: 2 is less than 5, swap → [2, 5, 4, 1]. i = 2: 4 swaps past 5 → [2, 4, 5, 1]. i = 3: 1 slides past 5, 4 and 2 → [1, 2, 4, 5]. That is 1 + 1 + 3 swaps."},{"t":"Print the result","d":"The array is [1, 2, 4, 5] after 5 swaps, which equals the number of inversions in the input."}],"c":"#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    // Step 1: Start with the array\n    int a[] = {5, 2, 4, 1};\n    int n = 4, swaps = 0;\n\n    // Step 2: Slide each entry left\n    for (int i = 1; i < n; i++)                   // grow the sorted prefix\n        for (int j = i; j > 0 && a[j - 1] > a[j]; j--) {\n            swap(a[j - 1], a[j]);                 // slide left\n            swaps++;\n        }\n\n    // Step 3: Print the result\n    for (int k = 0; k < n; k++) cout << a[k] << \" \";\n    cout << \"\\nSwaps: \" << swaps << \"\\n\";\n}"},"a3":{"s":[{"t":"Declare the board","d":"A 3 × 3 array: rows = 3 and cols = 3. Every cell starts as a dot."},{"t":"Choose the cell","d":"Take board[2][1], so r = 2 and c = 1, and store X there."},{"t":"Convert to a flat index","d":"Row-major formula: index = r × cols + c = 2 × 3 + 1 = 7. Rows 0 and 1 use indices 0–5, row 2 starts at 6, and column 1 of it is 7."},{"t":"Print the grid","d":"Row by row, the X appears in the bottom row, middle column."}],"c":"#include <iostream>\nusing namespace std;\n\nint main() {\n    // Step 1: Declare the board\n    const int ROWS = 3, COLS = 3;\n    char board[ROWS][COLS];\n    for (int r = 0; r < ROWS; r++)\n        for (int c = 0; c < COLS; c++) board[r][c] = '.';\n\n    // Step 2: Choose the cell\n    int r = 2, c = 1;\n    board[r][c] = 'X';\n    // Step 3: Convert to a flat index\n    cout << \"flat index = \" << r * COLS + c << \"\\n\";\n\n    char* flat = &board[0][0];            // same memory, one dimension\n    cout << \"flat[7] = \" << flat[r * COLS + c] << \"\\n\";\n\n    // Step 4: Print the grid\n    for (int i = 0; i < ROWS; i++) {\n        for (int j = 0; j < COLS; j++) cout << board[i][j] << \" \";\n        cout << \"\\n\";\n    }\n}"},"l1":{"s":[{"t":"Build the list","d":"insertFront(16), then 9, then 4 builds 4 → 9 → 16, because each new node goes in front of the old head."},{"t":"Insert 2 at the front","d":"Create a node, set its next to head, then move head to the new node: 2 → 4 → 9 → 16."},{"t":"Remove from the front twice","d":"Save head in t, set head = head→next and delete t. The first call removes 2, the second removes 4."},{"t":"Read the result","d":"The list left is 9 → 16. Every operation touched only the head, so each was O(1)."}],"c":"#include <iostream>\nusing namespace std;\n\nstruct Node { int data; Node* next; };\nNode* head = nullptr;\n\nvoid insertFront(int x) { head = new Node{x, head}; }\n\nvoid removeFront() {\n    if (!head) return;\n    Node* t = head;\n    head = head->next;\n    delete t;\n}\n\nvoid print() {\n    for (Node* p = head; p; p = p->next) cout << p->data << \" -> \";\n    cout << \"null\\n\";\n}\n\nint main() {\n    // Step 1: Build the list\n    insertFront(16); insertFront(9); insertFront(4);\n    print();                 // 4 -> 9 -> 16\n    // Step 2: Insert 2 at the front\n    insertFront(2);\n    print();                 // 2 -> 4 -> 9 -> 16\n    // Step 3: Remove from the front twice\n    removeFront(); removeFront();\n    // Step 4: Read the result\n    print();                 // 9 -> 16\n}"},"l2":{"s":[{"t":"Create the sentinels","d":"The header and trailer nodes are linked to each other, so even the empty list has no null neighbours."},{"t":"Insert 4, 9 and 16","d":"Every insert is the same pointer edit before the trailer, with no special cases: header ⇄ 4 ⇄ 9 ⇄ 16 ⇄ trailer."},{"t":"Remove the back node in O(1)","d":"last = trailer→prev hands us the node with no walking. Then last→prev→next = trailer, trailer→prev = last→prev, and delete last. A singly list would walk from head: O(n)."},{"t":"Read the result","d":"The list is now 4 9."}],"c":"#include <iostream>\nusing namespace std;\n\nstruct Node { int data; Node *prev, *next; };\n\nint main() {\n    // Step 1: Create the sentinels\n    Node* header  = new Node{0, nullptr, nullptr};\n    Node* trailer = new Node{0, header, nullptr};\n    header->next = trailer;\n\n    auto insertBefore = [&](Node* p, int x) {   // insert x before p\n        Node* n = new Node{x, p->prev, p};\n        p->prev->next = n;\n        p->prev = n;\n    };\n    auto print = [&]() {\n        for (Node* p = header->next; p != trailer; p = p->next) cout << p->data << \" \";\n        cout << \"\\n\";\n    };\n\n    // Step 2: Insert 4, 9 and 16\n    insertBefore(trailer, 4);\n    insertBefore(trailer, 9);\n    insertBefore(trailer, 16);\n    print();                                     // 4 9 16\n\n    // Step 3: Remove the back node in O(1)\n    Node* last = trailer->prev;                  // O(1): no traversal\n    last->prev->next = trailer;\n    trailer->prev = last->prev;\n    delete last;\n    // Step 4: Read the result\n    print();                                     // 4 9\n}"},"l3":{"s":[{"t":"Link the circle","d":"A → B → C → A: the last node points back to the first, so no pointer is null."},{"t":"Place the cursor","d":"The cursor starts on A."},{"t":"Advance five times","d":"Each advance is cursor = cursor→next, giving B, C, A, B, C."},{"t":"Check with a shortcut","d":"5 mod 3 = 2, and two steps past A is C, so the cursor ends on C."}],"c":"#include <iostream>\nusing namespace std;\n\nstruct Node { char data; Node* next; };\n\nint main() {\n    // Step 1: Link the circle\n    Node* a = new Node{'A', nullptr};\n    Node* b = new Node{'B', nullptr};\n    Node* c = new Node{'C', nullptr};\n    a->next = b; b->next = c; c->next = a;       // circular: tail->next = head\n\n    // Step 2: Place the cursor\n    Node* cursor = a;\n    // Step 3: Advance five times\n    for (int i = 1; i <= 5; i++) {\n        cursor = cursor->next;                   // advance (rotate)\n        cout << \"advance \" << i << \": \" << cursor->data << \"\\n\";\n    }\n    // Step 4: Check with a shortcut\n    cout << \"5 mod 3 = \" << 5 % 3 << \", cursor at \" << cursor->data << \"\\n\";\n}"},"l4":{"s":[{"t":"Build 1 → 2 → 3","d":"Three nodes linked in order; head points at node 1."},{"t":"Set the two pointers","d":"prev starts as null and cur starts at the head (node 1)."},{"t":"Flip every link","d":"Iteration 1: 1→next = null, prev = 1. Iteration 2: 2→next = 1, prev = 2. Iteration 3: 3→next = 2, prev = 3, cur = null and the loop ends."},{"t":"Move the head","d":"head = prev = 3, so the list reads 3 → 2 → 1. One pass: O(n) time, O(1) space."}],"c":"#include <iostream>\nusing namespace std;\n\nstruct Node { int data; Node* next; };\n\nint main() {\n    // Step 1: Build 1 → 2 → 3\n    Node* head = new Node{1, new Node{2, new Node{3, nullptr}}};\n\n    // Step 2: Set the two pointers\n    Node *prev = nullptr, *cur = head;\n    // Step 3: Flip every link\n    while (cur) {\n        Node* next = cur->next;   // remember the rest\n        cur->next = prev;         // flip the link\n        prev = cur;               // advance prev\n        cur = next;               // advance cur\n        cout << \"prev = \" << prev->data << \"\\n\";\n    }\n    // Step 4: Move the head\n    head = prev;\n\n    for (Node* p = head; p; p = p->next) cout << p->data << \" \";\n    cout << \"\\n\";                 // 3 2 1\n}"},"s1":{"s":[{"t":"Start with an empty stack","d":"The array-based stack keeps t, the index of the top. t = −1 means empty."},{"t":"Push 3, 8 and 5","d":"push(x) does S[++t] = x, so t goes 0, 1, 2. From bottom to top the stack is 3, 8, 5."},{"t":"Pop twice","d":"pop() returns S[t--]: first 5, then 8, and t drops to 0."},{"t":"Read top and size","d":"top() is S[0] = 3 and size = t + 1 = 1. All of these are O(1)."},{"t":"Do the same with the STL","d":"std::stack gives the same results with push, pop and top."}],"c":"#include <iostream>\n#include <stack>\nusing namespace std;\n\nclass ArrayStack {\n    int S[100];\n    int t = -1;                        // index of the top\npublic:\n    void push(int x) { S[++t] = x; }\n    int  pop()       { return S[t--]; }\n    int  top() const { return S[t]; }\n    int  size() const { return t + 1; }\n    bool empty() const { return t < 0; }\n};\n\nint main() {\n    // Step 1: Start with an empty stack\n    ArrayStack s;\n    // Step 2: Push 3, 8 and 5\n    s.push(3); s.push(8); s.push(5);\n    // Step 3: Pop twice\n    cout << \"pop: \" << s.pop() << \"\\n\";   // 5\n    cout << \"pop: \" << s.pop() << \"\\n\";   // 8\n    // Step 4: Read top and size\n    cout << \"top: \" << s.top() << \", size: \" << s.size() << \"\\n\";\n\n    // Step 5: Do the same with the STL\n    stack<int> q;                          // the same with the STL\n    q.push(3); q.push(8); q.push(5);\n    q.pop(); q.pop();\n    cout << \"STL top: \" << q.top() << \"\\n\";\n}"},"s2":{"s":[{"t":"Take the vector","d":"v = [1, 2, 3, 4] and an empty stack."},{"t":"Push every element","d":"Pushing in order leaves the stack, bottom to top, as 1, 2, 3, 4."},{"t":"The first pop","d":"The first pop returns 4, the last element that was pushed."},{"t":"Pop back into the vector","d":"Each pop is written into v from index 0: 4, 3, 2, 1."},{"t":"Print the reversed vector","d":"v is [4, 3, 2, 1]. n pushes plus n pops: O(n) time and O(n) extra space."}],"c":"#include <iostream>\n#include <stack>\n#include <vector>\nusing namespace std;\n\nint main() {\n    // Step 1: Take the vector\n    vector<int> v = {1, 2, 3, 4};\n    stack<int> s;\n\n    // Step 2: Push every element\n    for (int x : v) s.push(x);                 // push 1, 2, 3, 4\n    // Step 3: The first pop\n    cout << \"first pop = \" << s.top() << \"\\n\"; // 4\n\n    // Step 4: Pop back into the vector\n    for (size_t i = 0; i < v.size(); i++) {    // pop into v\n        v[i] = s.top();\n        s.pop();\n    }\n    // Step 5: Print the reversed vector\n    for (int x : v) cout << x << \" \";          // 4 3 2 1\n    cout << \"\\n\";\n}"},"q1":{"s":[{"t":"Describe the queue","d":"Capacity N = 8, front f = 6 and size n = 3, so the items sit in slots 6, 7 and 0. Both functions use mod N to wrap around."},{"t":"Find the rear slot","d":"(f + n) mod N = (6 + 3) mod 8 = 9 mod 8 = 1, so the next enqueue goes to slot 1."},{"t":"Enqueue 99","d":"99 is stored in a[1] and the size becomes 4. No other item moves."},{"t":"Dequeue","d":"dequeue takes a[f] = a[6], then f = (6 + 1) mod 8 = 7 and n drops to 3. Each operation is O(1)."}],"c":"#include <iostream>\nusing namespace std;\n\n// Step 1: Describe the queue\nconst int N = 8;\nint a[N] = {2, 0, 0, 0, 0, 0, 5, 8};   // items at slots 6, 7, 0\nint f = 6, n = 3;                        // front index and size\n\nvoid enqueue(int x) {\n    if (n == N) { cout << \"full\\n\"; return; }\n    a[(f + n) % N] = x;\n    n++;\n}\nint dequeue() {\n    int x = a[f];\n    f = (f + 1) % N;\n    n--;\n    return x;\n}\n\nint main() {\n    // Step 2: Find the rear slot\n    cout << \"next enqueue slot = \" << (f + n) % N << \"\\n\";   // 1\n    // Step 3: Enqueue 99\n    enqueue(99);\n    cout << \"a[1] = \" << a[1] << \", size = \" << n << \"\\n\";\n    // Step 4: Dequeue\n    cout << \"dequeue -> \" << dequeue() << \", front f = \" << f << \"\\n\";\n}"},"t1":{"s":[{"t":"Build a full tree of height 3","d":"Every internal node has two children and all leaves sit at depth 3."},{"t":"Read the height","d":"Height counts the edges on the longest root-to-leaf path: 3."},{"t":"Count the nodes","d":"Level sizes are 1, 2, 4 and 8, so n = 15 = 2^(h+1) − 1."},{"t":"Count the leaves","d":"Leaves are the nodes at depth 3, so there are 2^3 = 8."}],"c":"#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nstruct Node { int v; Node *l, *r; };\n\nNode* build(int h, int& id) {              // full tree of height h\n    Node* n = new Node{++id, nullptr, nullptr};\n    if (h > 0) { n->l = build(h - 1, id); n->r = build(h - 1, id); }\n    return n;\n}\nint count(Node* n)  { return n ? 1 + count(n->l) + count(n->r) : 0; }\nint leaves(Node* n) {\n    if (!n) return 0;\n    if (!n->l && !n->r) return 1;\n    return leaves(n->l) + leaves(n->r);\n}\nint height(Node* n) { return n ? 1 + max(height(n->l), height(n->r)) : -1; }\n\nint main() {\n    // Step 1: Build a full tree of height 3\n    int id = 0;\n    Node* root = build(3, id);\n    // Step 2: Read the height\n    cout << \"height = \" << height(root) << \"\\n\";   // 3\n    // Step 3: Count the nodes\n    cout << \"nodes  = \" << count(root)  << \"\\n\";   // 15 = 2^4 - 1\n    // Step 4: Count the leaves\n    cout << \"leaves = \" << leaves(root) << \"\\n\";   // 8  = 2^3\n}"},"t2":{"s":[{"t":"Build the tree","d":"Root 50 with left child 30 and right child 70."},{"t":"Preorder: node, left, right","d":"Visit 50, then the left subtree (30), then the right subtree (70): 50 30 70."},{"t":"Inorder: left, node, right","d":"Left subtree, root, right subtree: 30 50 70. For a search tree this is sorted order."},{"t":"Postorder: left, right, node","d":"Children before their parent: 30 70 50. Each node is visited once, so every traversal is O(n)."}],"c":"#include <iostream>\nusing namespace std;\n\nstruct Node { int v; Node *l, *r; };\n\nvoid pre(Node* n)  { if (!n) return; cout << n->v << \" \"; pre(n->l); pre(n->r); }\nvoid in(Node* n)   { if (!n) return; in(n->l); cout << n->v << \" \"; in(n->r); }\nvoid post(Node* n) { if (!n) return; post(n->l); post(n->r); cout << n->v << \" \"; }\n\nint main() {\n    // Step 1: Build the tree\n    Node* root = new Node{50, new Node{30, nullptr, nullptr},\n                              new Node{70, nullptr, nullptr}};\n    // Step 2: Preorder: node, left, right\n    cout << \"Preorder:  \"; pre(root);  cout << \"\\n\";   // 50 30 70\n    // Step 3: Inorder: left, node, right\n    cout << \"Inorder:   \"; in(root);   cout << \"\\n\";   // 30 50 70\n    // Step 4: Postorder: left, right, node\n    cout << \"Postorder: \"; post(root); cout << \"\\n\";   // 30 70 50\n}"},"t3":{"s":[{"t":"Start with an empty tree","d":"root = nullptr, so the first insert creates the root."},{"t":"Insert 40, 20, 60 and 10","d":"Smaller values go left and larger go right. 40 becomes the root, 20 its left child, 60 its right child, and 10 the left child of 20."},{"t":"Measure the height","d":"The longest path 40 → 20 → 10 has 2 edges, so the height is 2."}],"c":"#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nstruct Node { int v; Node *l, *r; };\n\nNode* insert(Node* n, int x) {              // BST insert, O(h)\n    if (!n) return new Node{x, nullptr, nullptr};\n    if (x < n->v) n->l = insert(n->l, x);\n    else          n->r = insert(n->r, x);\n    return n;\n}\nint height(Node* n) { return n ? 1 + max(height(n->l), height(n->r)) : -1; }\n\nint main() {\n    // Step 1: Start with an empty tree\n    Node* root = nullptr;\n    // Step 2: Insert 40, 20, 60 and 10\n    for (int x : {40, 20, 60, 10}) root = insert(root, x);\n    // Step 3: Measure the height\n    cout << \"root = \" << root->v << \", height = \" << height(root) << \"\\n\";   // height 2\n}"}};

/* ---- lightweight C++ interpreter (replaces Claude API) ---- */
function interpretCpp(code, stdinText) {
  let output = '';
  const print = s => { output += String(s); };
  const println = s => { output += String(s) + '\n'; };
  // Remove comments
  let src = code.replace(/\/\/.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '');
  // Remove preprocessor and using
  src = src.replace(/^\s*#.*$/gm, '').replace(/^\s*using\s+namespace\s+\w+;/gm, '');
  // Environment
  const env = { __structs: {}, __functions: {}, __globals: {} };
  const MAX_ITER = 100000;
  let iterCount = 0;
  function checkIter() { if (++iterCount > MAX_ITER) throw new Error('Execution limit reached (possible infinite loop)'); }

  // Tokenizer
  function tokenize(s) {
    const tokens = [];
    let i = 0;
    while (i < s.length) {
      if (/\s/.test(s[i])) { i++; continue; }
      // String literal
      if (s[i] === '"') {
        let j = i + 1, str = '';
        while (j < s.length && s[j] !== '"') {
          if (s[j] === '\\') { j++; const c = s[j]; str += c === 'n' ? '\n' : c === 't' ? '\t' : c === '\\' ? '\\' : c === '"' ? '"' : c === '0' ? '\0' : c; j++; }
          else { str += s[j]; j++; }
        }
        tokens.push({ type: 'string', value: str }); i = j + 1; continue;
      }
      // Char literal
      if (s[i] === "'") {
        let j = i + 1, ch = '';
        if (s[j] === '\\') { j++; const c = s[j]; ch = c === 'n' ? '\n' : c === 't' ? '\t' : c === '\\' ? '\\' : c === '0' ? '\0' : c; j++; }
        else { ch = s[j]; j++; }
        tokens.push({ type: 'char', value: ch }); i = j + 1; continue;
      }
      // Number
      if (/[0-9]/.test(s[i]) || (s[i] === '-' && i > 0 && /[=(<,{+\-*/%|&!^~;:]/.test(s[i-1].trim() || '=') && /[0-9]/.test(s[i+1] || ''))) {
        let j = i; if (s[j] === '-') j++;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        tokens.push({ type: 'number', value: parseFloat(s.slice(i, j)) }); i = j; continue;
      }
      // Operators (multi-char first)
      const ops2 = ['<<', '>>', '<=', '>=', '==', '!=', '&&', '||', '++', '--', '->', '+=', '-=', '*=', '/=', '%='];
      let found = false;
      for (const op of ops2) { if (s.slice(i, i + op.length) === op) { tokens.push({ type: 'op', value: op }); i += op.length; found = true; break; } }
      if (found) continue;
